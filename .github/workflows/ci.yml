name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e shared
      - name: Unit tests
        run: pytest -q --cov=shared/medflow_shared --cov-report=term-missing
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend build
        working-directory: frontend
        run: |
          npm install
          npm run build
